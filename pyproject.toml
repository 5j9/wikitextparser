[build-system]
requires = ['uv_build>=0.8.3,<0.9.0']
build-backend = 'uv_build'

[project]
name = "wikitextparser"
authors = [
    { name = "5j9", email = "5j9@users.noreply.github.com" },
]
description = "A simple parsing tool for MediaWiki's wikitext markup."
keywords = [
    "MediaWiki",
    "wikitext",
    "parser",
]
readme = "README.rst"
classifiers = [
    "Programming Language :: Python",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Text Processing",
]
requires-python = ">= 3.8"
dependencies = [
    "regex >= 2022.9.11",
    "wcwidth",
]
version = "1.0.3"

[project.license]
text = "GNU General Public License v3 (GPLv3)"

[project.urls]
Homepage = "https://github.com/5j9/wikitextparser"

[project.optional-dependencies]
dev = [
    "coverage",
]
tests = [
    "pytest",
]

[tool.ruff]
line-length = 79
format.quote-style = 'single'

[tool.ruff.lint]
extend-select = [
    'W605', # invalid-escape-sequence
    'FA',   # flake8-future-annotations
    'I',    # isort
    'UP',   # pyupgrade
    'RUF',  # Ruff-specific rules (RUF)
]
ignore = [
    'B023', # function-uses-loop-variable
    'BLE001', # blind-except
    'DTZ', # flake8-datetimez
    'E721', # Do not compare types, use `isinstance()`
    'PLW1510', # subprocess-run-without-check
    'RUF001', # ambiguous-unicode-character-string
    'RUF002', # ambiguous-unicode-character-docstring
    'RUF003', # ambiguous-unicode-character-comment
    'RUF012', # mutable-class-default
    'RUF059', # Unpacked variable never used
    'SIM102', # collapsible-if
    'SIM103', # Return the condition directly
    'SIM115', # Use a context manager for opening files
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest]
addopts = ["--quiet", "--tb=short"]
truncation_limit_lines = '0'
truncation_limit_chars = '0'
[tool.pyright]
typeCheckingMode = 'standard'
reportDeprecated = "warning"
reportPropertyTypeMismatch = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryContains = "warning"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryTypeIgnoreComment = true
reportInvalidStringEscapeSequence = false
reportConstantRedefinition = 'error'
reportTypeCommentUsage = 'warning'
reportUnnecessaryComparison = 'warning'
venvPath = "."
venv = ".venv"

[tool.uv.build-backend]
module-root = ""
module-name = "wikitextparser"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
